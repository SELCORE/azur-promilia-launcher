name: 문제 신고
description: 런처나 게임 실행이 잘 안 될 때
title: "[문제] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 고마워요. 런처 창의 **문제 보고** 버튼을 누르면 아래 "런처 보고 내용"이 클립보드에 복사돼요.
        로그인 토큰, 이메일, 맥 사용자 이름은 자동으로 가려져요. 그래도 올리기 전에 한 번 훑어봐 주세요.
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
      description: 무엇을 했을 때 어떻게 됐는지 적어 주세요. 스크린샷이 있으면 끌어다 넣어 주세요.
      placeholder: 예) 넥슨 플러그에서 게임 설치를 누르면 0%에서 멈춰요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 일어나게 하는 방법
      placeholder: |
        1. 런처를 연다
        2. 넥슨 플러그 실행
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: 어디에서 생겼나요?
      options:
        - 처음 준비(설치) 중
        - 넥슨 플러그 화면이나 로그인
        - 게임 다운로드
        - 게임 실행 중
        - 키보드 입력
        - 그 밖에
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: 런처 보고 내용
      description: 런처 창의 "문제 보고" 버튼을 누른 뒤 여기에 붙여 넣어 주세요 (⌘V).
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: 확인
      options:
        - label: 비공식 런처이고, 넥슨에 이 런처 문제로 문의하면 안 된다는 걸 알고 있어요.
          required: true
